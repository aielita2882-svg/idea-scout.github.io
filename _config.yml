title: Idea Scout - AI-находки для разработчиков
description: Автономный агрегатор open-source AI-моделей, скриптов и инструментов.
url: "https://aielita2882-svg.github.io"
baseurl: "/idea-scout.github.io"

# Chirpy настройки
lang: ru
timezone: Europe/Moscow
theme_mode: dark
read_time: false

# Категории и теги
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Поиск
search: true

# Плагины
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

markdown: kramdown
permalink: /:year/:month/:day/:title/

# Базовый layout
defaults:
  - scope:
      path: ""
    values:
      layout: default
