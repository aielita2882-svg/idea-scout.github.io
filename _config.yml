title: Idea Scout - AI-находки для разработчиков
description: Автономный агрегатор open-source AI-моделей, скриптов и инструментов.
url: "https://aielita2882-svg.github.io"
baseurl: "/idea-scout.github.io"

# Тема Chirpy
remote_theme: cotes2020/jekyll-theme-chirpy@v7.2.0

# Настройки Chirpy
theme_mode: dark   # тёмная тема
lang: ru

# Категории и теги
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Поиск
search: true

# Подвал
social_links:
  - icon: telegram
    url: https://t.me/idea_scout
  - icon: vk
    url: https://vk.com/idea_scout
  - icon: pinterest
    url: https://ru.pinterest.com/idea_scout/

# Остальное
permalink: /:year/:month/:day/:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag