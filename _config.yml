title: Idea Scout - AI-находки для разработчиков
description: Автономный агрегатор open-source AI-моделей, скриптов и инструментов.
url: "https://aielita2882-svg.github.io"
baseurl: "/idea-scout.github.io"

remote_theme: cotes2020/jekyll-theme-chirpy@v7.2.1

lang: ru
timezone: Europe/Moscow
theme_mode: dark
read_time: false

collections:
  tabs:
    output: true
    sort_by: order

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

search: true

social_links:
  - icon: telegram
    url: https://t.me/idea_scout
  - icon: vk
    url: https://vk.com/idea_scout
  - icon: pinterest
    url: https://ru.pinterest.com/idea_scout/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

markdown: kramdown
permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: default